[env]
PROJECT_NAME = "FastAPI MongoDB Vue Stack Demo"
DOMAIN = "localhost"
STACK_NAME = "fmv-demo"

DOCKER_REGISTRY = "ghcr.io"
DOCKER_IMAGE_BACKEND = "lambchop4prez/fmv-demo-backend"
DOCKER_IMAGE_FRONTEND = "lambchop4prez/fmv-demo-frontend"

BACKEND_REPOSITORY = "mongodb"
# BACKEND_REPOSITORY=inmemory
BACKEND_MONGO_HOST = "localhost"
BACKEND_MONGO_DATABASE = "robot"
BACKEND_BROKER_HOST = "localhost"
# Environment gate: "production" rejects the static_jwks dev/CI stub at startup (fail closed).
BACKEND_ENVIRONMENT = "dev"

# http://localhost:8080 is the ci compose frontend origin (docker-compose.yaml
# exposes 8080); mise exports [env] into CI, so the compose default never applies.
CORS_ALLOW_ORIGINS = '["https://localhost:8000", "https://localhost:5173", "http://localhost:8080"]'
# Session cookies (D1=a) require credentials; origins above stay explicit (no wildcard).
CORS_ALLOW_CREDENTIALS = "true"

FRONTEND_API_BASE_URL = "https://localhost:8000"
VITE_API_ENDPOINT = "https://localhost:8800/api/v1"
VITE_DEV_CERT = "{{config_root}}/.cert/cert.pem"
VITE_DEV_CERT_KEY = "{{config_root}}/.cert/key.pem"

# OIDC frontend settings, read by ui/src/composables/auth.ts (useUserManagerSettings).
# COUPLING: VITE_OIDC_AUTHORITY MUST equal OIDC__PROVIDERS__KEYCLOAK__ISSUER in
# .secrets.env.example (both https://localhost:8443/realms/fmv) so the dev mock IdP
# matches. The mock IdP is NOT real Keycloak.
# VITE_OIDC_SILENT_REDIRECT_URI is optional; auth.ts falls back to VITE_OIDC_REDIRECT_URI.
VITE_OIDC_AUTHORITY = "https://localhost:8443/realms/fmv"
VITE_OIDC_CLIENT_ID = "fmv-web"
VITE_OIDC_REDIRECT_URI = "https://localhost:5173/callback"
VITE_OIDC_RESPONSE_TYPE = "code"
VITE_OIDC_SCOPE = "openid profile email groups"
VITE_OIDC_POST_LOGOUT_REDIRECT_URI = "https://localhost:5173/logout"

_.file = ["{{config_root}}/.secrets.env"]

[tools]
"python" = "3.14.7"
"node" = "24.20.0"
"aqua:evilmartians/lefthook" = "2.1.11"
"aqua:astral-sh/uv" = "0.12.5"
"aqua:casey/just" = "1.58.0"
"aqua:charmbracelet/gum" = "2.0.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:pnpm/pnpm" = "11.26.0"
# @yarnpkg/libzip@3.2.2 (transitive, Yarn support unused here) lacks provenance; published manually by arcanis. Review/remove exclusion if republished with provenance.
"npm:renovate" = { version = "44.69.3", trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }
"pipx:python-semantic-release" = "10.6.2"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:crate-ci/typos" = "1.49.0"
"aqua:jqlang/jq" = "1.8.1"
"aqua:FiloSottile/mkcert" = "1.4.4"
opencode = "1.18.21"
ripgrep = "15.2.0"
fd = "10.5.0"
fzf = "0.74.3"
