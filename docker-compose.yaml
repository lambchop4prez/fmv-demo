  #       - traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK?Variable not set}
  #       # Use the custom label "traefik.constraint-label=traefik-public"
  #       # This public Traefik will only use services with this label
  #       - traefik.constraint-label=${TRAEFIK_PUBLIC_TAG?Variable not set}
  #       # traefik-http set up only to use the middleware to redirect to https
  #       - traefik.http.middlewares.${STACK_NAME?Variable not set}-https-redirect.redirectscheme.scheme=https
  #       - traefik.http.middlewares.${STACK_NAME?Variable not set}-https-redirect.redirectscheme.permanent=true
  #       # Handle host with and without "www" to redirect to only one of them
  #       # Uses environment variable DOMAIN
  #       # To disable www redirection remove the Host() you want to discard, here and
  #       # below for HTTPS
  #       - traefik.http.routers.${STACK_NAME?Variable not set}-proxy-http.rule=Host(`${DOMAIN?Variable not set}`) || Host(`www.${DOMAIN?Variable not set}`)
  #       - traefik.http.routers.${STACK_NAME?Variable not set}-proxy-http.entrypoints=http
  #       # traefik-https the actual router using HTTPS
  #       - traefik.http.routers.${STACK_NAME?Variable not set}-proxy-https.rule=Host(`${DOMAIN?Variable not set}`) || Host(`www.${DOMAIN?Variable not set}`)
  #       - traefik.http.routers.${STACK_NAME?Variable not set}-proxy-https.entrypoints=https
  #       - traefik.http.routers.${STACK_NAME?Variable not set}-proxy-https.tls=true
  #       # Use the "le" (Let's Encrypt) resolver created below
  #       - traefik.http.routers.${STACK_NAME?Variable not set}-proxy-https.tls.certresolver=le
  #       # Define the port inside of the Docker service to use
  #       - traefik.http.services.${STACK_NAME?Variable not set}-proxy.loadbalancer.server.port=80
  #       # Handle domain with and without "www" to redirect to only one
  #       # To disable www redirection remove the next line
  #       - traefik.http.middlewares.${STACK_NAME?Variable not set}-www-redirect.redirectregex.regex=^https?://(www.)?(${DOMAIN?Variable not set})/(.*)
  #       # Redirect a domain with www to non-www
  #       # To disable it remove the next line
  #       - traefik.http.middlewares.${STACK_NAME?Variable not set}-www-redirect.redirectregex.replacement=https://${DOMAIN?Variable not set}/$${3}
  #       # Redirect a domain without www to www
  #       # To enable it remove the previous line and uncomment the next
  #       # - traefik.http.middlewares.${STACK_NAME}-www-redirect.redirectregex.replacement=https://www.${DOMAIN}/$${3}
  #       # Middleware to redirect www, to disable it remove the next line
  #       - traefik.http.routers.${STACK_NAME?Variable not set}-proxy-https.middlewares=${STACK_NAME?Variable not set}-www-redirect
  #       # Middleware to redirect www, and redirect HTTP to HTTPS
  #       # to disable www redirection remove the section: ${STACK_NAME?Variable not set}-www-redirect,
  #       - traefik.h
  #     - /var/run/http.routers.${STACK_NAME?Variable not set}-proxy-http.middlewares=${STACK_NAME?Variable not set}-www-redirect,${STACK_NAME?Variable not set}-https-redirect
  #
  api:
    image: "${DOCKER_REGISTRY?Variable not set}/${DOCKER_IMAGE_BACKEND?Variable not set}:${NEW_VERSION-latest}"
    logging:
      driver: json-file
      options:
        max-size: 200k
        max-file: "3"
    environment:
      - SERVER_NAME=${DOMAIN?Variable not set}
      - SERVER_HOST=https://${DOMAIN?Variable not set}
      - BACKEND_MONGO_HOST=mongodb
      - BACKEND_REPOSITORY=mongodb
      # --- OIDC / session (canonical names in .secrets.env.example) ----------
      # Secrets come from the environment only; compose fails fast when unset.
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:?Variable not set}
      - OIDC__DEFAULT_PROVIDER=${OIDC__DEFAULT_PROVIDER:-keycloak}
      - OIDC__PROVIDERS__KEYCLOAK__ISSUER=${OIDC__PROVIDERS__KEYCLOAK__ISSUER:?Variable not set}
      - OIDC__PROVIDERS__KEYCLOAK__AUDIENCE=${OIDC__PROVIDERS__KEYCLOAK__AUDIENCE:?Variable not set}
      - OIDC__PROVIDERS__KEYCLOAK__CLIENT_ID=${OIDC__PROVIDERS__KEYCLOAK__CLIENT_ID:?Variable not set}
      - OIDC__PROVIDERS__KEYCLOAK__ROLE_CLAIMS=${OIDC__PROVIDERS__KEYCLOAK__ROLE_CLAIMS:-groups}
      # Dev-only opt-out (D7): the mock IdP serves a self-signed/mkcert cert.
      # The settings default is true; production deployments must keep it true.
      - OIDC__PROVIDERS__KEYCLOAK__VERIFY_SSL=${OIDC__PROVIDERS__KEYCLOAK__VERIFY_SSL:-false}
      # Static-key stub (D2): tokens verified offline against this mounted
      # public JWKS fixture — no network call to the mock IdP is made.
      - OIDC__PROVIDERS__KEYCLOAK__STATIC_JWKS_FILE=${OIDC__PROVIDERS__KEYCLOAK__STATIC_JWKS_FILE:-/app/src/test/fixtures/oidc_test_jwks.json}
      # Session cookies (D1=a) require credentials; origins stay explicit in env.
      - CORS_ALLOW_CREDENTIALS=true
      # Explicit origins (wildcard + credentials is invalid CORS). Covers the
      # ci frontend (http://localhost:8080) and dev vite (https://localhost:5173).
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-["http://localhost:8080","https://localhost:5174","https://localhost:8800"]}
      # "production" rejects the static_jwks stub at startup (fail closed).
      - BACKEND_ENVIRONMENT=${BACKEND_ENVIRONMENT:-dev}
      # Allow explicit env var override for tests
      # - SMTP_HOST=${SMTP_HOST}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_APP_MODULE: ${BACKEND_APP_MODULE-app.main:app}
        BACKEND_PRE_START_PATH: ${BACKEND_PRE_START_PATH-/app/prestart.sh}
        BACKEND_PROCESS_MANAGER: ${BACKEND_PROCESS_MANAGER-gunicorn}
        BACKEND_WITH_RELOAD: ${BACKEND_WITH_RELOAD-false}
        INSTALL_DEV: ${INSTALL_DEV-false}
    ports:
      - 8000:8000
    command: uv run fastapi run src/api
    volumes:
      # Public JWKS fixture (kid fmv-test-key-1) for offline token verification.
      - ./src/test/fixtures:/app/src/test/fixtures:ro
    profiles:
      - backend
      - api
      - ci

  workers:
    image: "${DOCKER_REGISTRY?Variable not set}/${DOCKER_IMAGE_BACKEND?Variable not set}:${NEW_VERSION-latest}"
    logging:
      driver: json-file
      options:
        max-size: 200k
        max-file: "3"
    environment:
      - SERVER_NAME=${DOMAIN?Variable not set}
      - SERVER_HOST=https://${DOMAIN?Variable not set}
      - BACKEND_REPOSITORY=mongodb
      - BACKEND_MONGO_HOST=mongodb
      - BACKEND_BROKER_HOST=rabbitmq
      # --- OIDC / session (parity with api; canonical names in .secrets.env.example) ---
      # Workers do not validate tokens today, but share the settings model;
      # keep env parity so a worker that imports auth config never crashes.
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:?Variable not set}
      - OIDC__DEFAULT_PROVIDER=${OIDC__DEFAULT_PROVIDER:-keycloak}
      - OIDC__PROVIDERS__KEYCLOAK__ISSUER=${OIDC__PROVIDERS__KEYCLOAK__ISSUER:?Variable not set}
      - OIDC__PROVIDERS__KEYCLOAK__AUDIENCE=${OIDC__PROVIDERS__KEYCLOAK__AUDIENCE:?Variable not set}
      - OIDC__PROVIDERS__KEYCLOAK__CLIENT_ID=${OIDC__PROVIDERS__KEYCLOAK__CLIENT_ID:?Variable not set}
      - OIDC__PROVIDERS__KEYCLOAK__ROLE_CLAIMS=${OIDC__PROVIDERS__KEYCLOAK__ROLE_CLAIMS:-groups}
      - OIDC__PROVIDERS__KEYCLOAK__VERIFY_SSL=${OIDC__PROVIDERS__KEYCLOAK__VERIFY_SSL:-false}
      - OIDC__PROVIDERS__KEYCLOAK__STATIC_JWKS_FILE=${OIDC__PROVIDERS__KEYCLOAK__STATIC_JWKS_FILE:-/app/src/test/fixtures/oidc_test_jwks.json}
      - BACKEND_ENVIRONMENT=${BACKEND_ENVIRONMENT:-dev}
      # Allow explicit env var override for tests
      # - SMTP_HOST=${SMTP_HOST}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_APP_MODULE: ${BACKEND_APP_MODULE-app.main:app}
        BACKEND_PRE_START_PATH: ${BACKEND_PRE_START_PATH-/app/prestart.sh}
        BACKEND_PROCESS_MANAGER: ${BACKEND_PROCESS_MANAGER-gunicorn}
        BACKEND_WITH_RELOAD: ${BACKEND_WITH_RELOAD-false}
        INSTALL_DEV: ${INSTALL_DEV-false}
    command: uv run celery -A workers worker -l INFO
    volumes:
      # Same public JWKS fixture as api; workers never need the private key.
      - ./src/test/fixtures:/app/src/test/fixtures:ro
    depends_on:
      - mongodb
      - rabbitmq
    profiles:
      - backend
      - worker
      - ci

  frontend:
    image: "${DOCKER_REGISTRY?Variable not set}/${DOCKER_IMAGE_FRONTEND?Variable not set}:${NEW_VERSION-latest}"
    environment:
      - VITE_API_ENDPOINT=http://api:8000
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - 8080:8080
    profiles:
      - frontend
      - ci

  mongodb:
    image: mongo
    ports:
      - 27017:27017
    # command: ["mongod", "--logpath", "/dev/null"] # Reduces logging verbosity
    volumes:
      - app_data:/data/db
    profiles:
      - backend
      - infra
      - ci

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - 5672:5672 # amqp port
      - 15672:15672 # Management port
    profiles:
      - backend
      - infra
      - ci

  # Mock OIDC identity provider for local dev and e2e ONLY (decision D6).
  # This is NOT Keycloak. It serves OIDC discovery, the static public JWKS,
  # and a login page at ${OIDC__PROVIDERS__KEYCLOAK__ISSUER} (dev value:
  # https://localhost:8443/realms/fmv), signing id_tokens with the committed
  # TEST private key fixture (kid "fmv-test-key-1"). The api verifies tokens
  # offline via its STATIC_JWKS_FILE mount — it never calls this service.
  # `just up` runs compose with --no-build, so build the image once first:
  #   docker compose --profile infra build mock-idp
  mock-idp:
    image: fmv-demo-mock-idp:local
    build:
      context: ./ci/mock-idp
    logging:
      driver: json-file
      options:
        max-size: 200k
        max-file: "3"
    environment:
      - MOCK_IDP_ISSUER=${OIDC__PROVIDERS__KEYCLOAK__ISSUER:?Variable not set}
      - MOCK_IDP_CLIENT_ID=${OIDC__PROVIDERS__KEYCLOAK__CLIENT_ID:?Variable not set}
      - MOCK_IDP_AUDIENCE=${OIDC__PROVIDERS__KEYCLOAK__AUDIENCE:?Variable not set}
      - MOCK_IDP_KID=${MOCK_IDP_KID:-fmv-test-key-1}
      # Groups map to scopes via the provider's role_claims (D3). Include the
      # robot:* scopes so the protected robot routes are reachable in dev/e2e.
      - MOCK_IDP_GROUPS=${MOCK_IDP_GROUPS:-robot:read,robot:write,robot:run,user,admin}
      - MOCK_IDP_PRIVATE_KEY_FILE=/fixtures/oidc_test_private_key.pem
      - MOCK_IDP_JWKS_FILE=/fixtures/oidc_test_jwks.json
    volumes:
      # Shared test fixtures: same keypair the api verifies against.
      - ./src/test/fixtures:/fixtures:ro
      # mkcert certs from `just setup`; the service self-signs when absent.
      - ./.cert:/certs:ro
    ports:
      - 8443:8443
    healthcheck:
      test: [ "CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://localhost:8443/realms/fmv/.well-known/openid-configuration', context=ssl._create_unverified_context(), timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles:
      - infra
      - ci
      - backend

volumes:
  app_data:
